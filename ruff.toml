# Ruff rules shared with the other platform Python services (DevSecOps Phase 1, L2 baseline).
# The adapters were split out of solo-empire and put their siblings on sys.path before importing.
target-version = "py312"

[lint]
select = [
    "E", "W", "F", "I", "B", "BLE", "UP", "C4", "SIM", "RUF", "PIE", "PT", "RET", "ISC",
    "PERF", "LOG", "G", "FURB",
]
# - E501: ruff format wraps code at 88; what stays longer are noqa/nosemgrep justifications,
#   which must sit on the flagged line.
# - I001: import order is load-bearing (sys.path setup before the late imports), so imports are
#   not re-sorted.
# - RUF100: the existing `# noqa: E402 (...)` comments explain each late import; keep them.
# Lint debt that needs a behaviour review before it can be fixed (re-enable one by one):
# - BLE001: ~46 deliberate broad excepts that map any provider/IO failure to a safe error envelope.
# - TRY004 / S110 (not selected today; kept so enabling TRY or S does not flag them by surprise):
#   ValueError -> TypeError would change the exception type callers and tests rely on, and one
#   best-effort metadata lookup swallows errors on purpose.
ignore = ["E501", "I001", "RUF100", "BLE001", "TRY004", "S110"]

[lint.per-file-ignores]
# The suites are unittest.TestCase classes (README runs them with `python -m unittest`); their
# self.assert* calls stay.
"tests/*" = ["PT009", "PT027"]
